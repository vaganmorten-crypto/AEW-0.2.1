[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aew"
version = "0.3.0.dev0"
description = "AEW: Open-Ended Economic Evolution Laboratory"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Morten Vågan"}]

[tool.setuptools.packages.find]
include = ["aew*"]
